# Minimum connection interval for auto-connect, 7.5ms
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6

# 11.25ms connection interval from the peripheral half to the central half
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9

# Latency 0 means the peripheral half never skips a connection event and stays
# actively listening. Fixes the peripheral sleeping too deeply to be woken by
# the central, at a small cost in peripheral power draw.
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# The link is only dropped after 4000ms with no communication
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Battery sample/notify interval in seconds (default 60). Battery moves over
# days, so waking the radio every minute is waste; a longer interval also cuts
# down on BLE battery notifications waking a sleeping Mac.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Enable the rotary encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# MOUSE
CONFIG_ZMK_POINTING=y

# Smooth scrolling was tried and reverted. The host does not apply the HID
# Resolution Multiplier the way the descriptor advertises, so larger divisors
# just produced choppy discrete jumps. Back to classic whole-detent scrolling.
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# CONFIG_ZMK_EXT_POWER=y

# Increase key debounce
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable RGB underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_LED_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Auto turn off (deep sleep)
# Enters System OFF after inactivity; wakes on any key press. Each half sleeps independently.
CONFIG_ZMK_SLEEP=y

# Inactivity before deep sleep, in ms (1800000 = 30 min; ZMK default is 900000).
# Raised from 5 min because waking from System OFF is unreliable on this build;
# a longer timeout means fewer chances to get bitten by it.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Inactivity before idle (low power, still connected). Default 30000ms.
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Everything in this file applies to both halves. The left/right .conf files
# next to it are for settings that differ between the two.

# Bluetooth tuning
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Remapping (ZMK Studio)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
