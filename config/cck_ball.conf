# 设置自动连接最小间隔时间为7.5ms
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6

# 11.25ms的副手链接主手的时间间隔
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9

# 延迟为0，意味着副手不会跳过任何链接事键，始终保持活跃监听状态，能解决因为睡眠太深而无法被主手唤醒的问题，稍微增加副手的功耗
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# 超过4000ms，在这个时间段内没有通信，链接才会被断开
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 电量采样/上报间隔，单位秒（默认 60）。电量以天为单位变化，每分钟
# 唤醒一次电台没有意义；调高还能减少 macOS 被蓝牙电量通知唤醒的情况。
# Battery sample/notify interval in seconds (default 60). Battery moves over
# days, so waking the radio every minute is waste; a longer interval also cuts
# down on BLE battery notifications waking a sleeping Mac.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=600

# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

#开启旋钮
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# MOUSE
CONFIG_ZMK_POINTING=y

# 平滑滚动试过了，主机（macOS）并没有按描述符声明的方式使用 Resolution
# Multiplier：分频越大越卡顿，所以退回经典整档滚动。
# Smooth scrolling was tried and reverted. The host does not apply the HID
# Resolution Multiplier the way the descriptor advertises, so larger divisors
# just produced choppy discrete jumps. Back to classic whole-detent scrolling.
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# CONFIG_ZMK_EXT_POWER=y

# 增加键盘消抖
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 启用键盘RGB功能
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_LED_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# 自动关机（深度睡眠）/ Auto turn off (deep sleep)
# 无操作一段时间后进入 System OFF，按任意键唤醒。两半分别独立进入睡眠。
# Enters System OFF after inactivity; wakes on any key press. Each half sleeps independently.
CONFIG_ZMK_SLEEP=y

# 进入深度睡眠前的无操作时间，单位 ms（300000 = 5 分钟，ZMK 默认 900000）
# Inactivity before deep sleep, in ms (300000 = 5 min; ZMK default is 900000)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# 进入浅度空闲（省电但仍保持连接）前的时间，默认 30000ms
# Inactivity before idle (low power, still connected). Default 30000ms.
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
#此文件下是分体两边都生效的，里面的左右conf文件是两边有不同功能配置时操作的

# 蓝牙增强
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 改键
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n



