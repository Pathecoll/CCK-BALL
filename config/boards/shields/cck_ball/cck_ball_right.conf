# 分体电量上报（右手为主机）/ Split battery reporting (right half is central)
# FETCHING：主机主动向副手查询电量
# PROXY：主机把副手电量作为第二个 BAS 特征值一起上报给电脑
# FETCHING: central queries the peripheral for its battery level.
# PROXY: central exposes that as a second Battery Service characteristic.
# 注意：macOS 原生蓝牙界面只会显示主机（右手）那一个数字，
# 要同时看到两半需要 Mighty Mitts 或 zmk-battery-center 这类第三方工具。
# NOTE: macOS's native Bluetooth UI shows only the central's level. Seeing both
# halves requires a third-party menu-bar app (Mighty Mitts, zmk-battery-center).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
